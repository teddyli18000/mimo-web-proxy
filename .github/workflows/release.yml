name: Release

# 打 tag（v*）自动构建三平台产物并发布 pre-release。
# 手动触发（Actions → Release → Run workflow）只构建并上传 artifact，不发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: windows-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset: macos-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset: macos-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: linux-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # static/ 未入库（.gitignore 排除），必须先在 CI 里构建前端，go:embed 才有内容
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          BIN=dist/mimo-web-proxy
          if [ "$GOOS" = "windows" ]; then BIN=dist/mimo-web-proxy.exe; fi
          go build -trimpath -ldflags "-s -w" -o "$BIN" .
          ls -lh dist

      # ---------- Windows：zip ----------
      - name: Package (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          Copy-Item config.example.json dist/
          Compress-Archive -Path dist/* -DestinationPath "mimo-web-proxy-${{ matrix.asset }}.zip"

      # ---------- Linux：tar.gz ----------
      - name: Package (Linux)
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          cp config.example.json dist/
          tar -czf "mimo-web-proxy-${{ matrix.asset }}.tar.gz" -C dist .

      # ---------- macOS：.app bundle + dmg ----------
      - name: Package (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *) VERSION="0.0.0" ;;
          esac
          APP="dist/MiMo Web Proxy.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          mv dist/mimo-web-proxy "$APP/Contents/MacOS/mimo-web-proxy"
          chmod +x "$APP/Contents/MacOS/mimo-web-proxy"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>MiMo Web Proxy</string>
            <key>CFBundleDisplayName</key><string>MiMo Web Proxy</string>
            <key>CFBundleIdentifier</key><string>com.teddyli18000.mimo-web-proxy</string>
            <key>CFBundleExecutable</key><string>mimo-web-proxy</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # 无开发者证书，做 ad-hoc 签名让 bundle 结构合法（不解决 Gatekeeper 拦截）
          codesign --force --deep --sign - "$APP" 2>/dev/null || true

          cp config.example.json dist/
          cat > dist/使用说明.txt <<'TXT'
          MiMo Web Proxy for macOS

          首次打开（未签名，macOS 会拦截）：
            右键点击 "MiMo Web Proxy.app" → 打开 → 在弹窗里再点"打开"
          或执行：
            xattr -dr com.apple.quarantine "/Applications/MiMo Web Proxy.app"

          使用：
            双击 App，浏览器自动打开面板 http://localhost:8080
            在面板里填入 MiMo Cookie 即可

          配置位置：
            ~/Library/Application Support/mimo-web-proxy/
          TXT

          hdiutil create -volname "MiMo Web Proxy" -srcfolder dist -ov -format UDZO \
            "mimo-web-proxy-${{ matrix.asset }}.dmg"
          ls -lh *.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            *.zip
            *.tar.gz
            *.dmg
          if-no-files-found: error

  release:
    name: Publish pre-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # release 正文只写版本信息：安装、配置、客户端接入都在 README 里，
          # 在这里重复一遍只会跟文档一起腐烂。具体变更由维护者补充。
          body: |
            Windows / macOS (arm64 · amd64) / Linux 三平台构建。

            安装与使用见 [README](https://github.com/teddyli18000/mimo-web-proxy#readme)。
